[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mekong-flood-forecasting"
version = "0.1.0"
description = "Research prototype: forecasting simulated (GloFAS) Mekong discharge at Kratie, with an MRC-ready data architecture"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "pyarrow", "scikit-learn", "statsmodels", "matplotlib", "plotly", "streamlit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "scripts", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (deselect with -m 'not network')"]
